[[ban]]
paths = ["apps/web/src/lib/components/**"]
syntax = "style"

[comment]
allow = false

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "apps/*/tests/**/*.test.tsx",
    "crates/*/tests/**/*.rs",
]
syntax = "test"

[[grant]]
paths = [
    "apps/*/tests/**/*.test.ts",
    "apps/*/tests/**/*.test.tsx",
    "apps/web/vite.config.ts",
    "crates/*/tests/**/*.rs",
    "crates/api/src/runtime.rs",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 4

[module]
roots = [
    "apps/*/src",
    "apps/*/tests",
    "crates/*/src",
    "crates/*/tests",
    "docs",
]

[scan]
exclude = [
    "**/dist/**",
    "**/node_modules/**",
    "**/target/**",
]
include = [
    "apps/**/*.css",
    "apps/**/*.scss",
    "apps/**/*.ts",
    "apps/**/*.tsx",
    "crates/**/*.rs",
    "docs/**/*.md",
]

[[vocabulary.term]]
description = "Foreign jsonwebtoken type naming a public key already parsed for verification; the seam holds one per key id."
name = "DecodingKey"

[word]
single = true
