[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The codehull api server, a keel caller; the codehull CLI; the repository kernel; and the ssh adaptor."

[[layout.seat]]
path = "apps/*"
anchor = []
note = "The deferred web plane; the seat is held so the delivery paradigm can return."

[[layout.seat]]
path = "deploy"
note = "The local compose surface and its configuration."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".runseal"
note = "Committed Runseal resources."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
note = "Rust workspace anchors and the pinned toolchain."

[[layout.file]]
name = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "biome.json"]
note = "The pnpm workspace anchors held for the web plane."

[[layout.file]]
name = ["ARCHITECTURE.md", "DESIGN.md"]
note = "Mechanism map and boundary doctrine."

[[layout.file]]
name = ["Containerfile"]
note = "The codehull-api image wharf builds; it bakes in no configuration."

[[layout.file]]
name = ["codehull.toml", "docker-compose.yml", ".dockerignore"]
note = "Local runtime configuration and the compose entry."

[release]
product = "codehull"
authority = "https://releases.codehull.perish.uk"
binaries = ["codehull", "codehull-api"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[release.binary.codehull-api]
targets = ["x86_64-unknown-linux-gnu"]
install = false

[release.oci]
registry = "ghcr.io"
image = "perishlab/codehull"
account = "PerishLab"
binary = "codehull-api"

[release.chart]
registry = "ghcr.io"
chart = "perishlab/codehull"
account = "PerishLab"
