[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "the codehull server"
publish = false

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
axum = { workspace = true }
flate2 = { workspace = true }
http-body-util = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
codehull-repo = { path = "../repo" }
codehull-ssh = { path = "../ssh" }
keel = { workspace = true, features = ["pg"] }
keel-blob = { workspace = true }
keel-gate = { workspace = true }
keel-relay = { workspace = true }
plumb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ureq = { workspace = true }
