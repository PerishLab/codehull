[workspace]
resolver = "3"
members = ["crates/api", "crates/cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://git.perish.top/PerishLab/codehull"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
axum = "0.8"
base64 = "0.22"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
keel = { version = "0.10.3", registry = "perish", features = ["pg"] }
keel-gate = { version = "0.10.3", registry = "perish" }
keel-blob = { version = "0.10.3", registry = "perish" }
keel-relay = { version = "0.10.3", registry = "perish" }
plumb = { version = "0.18.21", registry = "perish" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
ureq = { version = "3", features = ["json", "rustls"] }
