[workspace]
resolver = "3"
members = ["crates/api", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://git.perish.top/PerishLab/codehull"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
axum = "0.8"
keel = { version = "0.5.1", registry = "perish" }
keel-gate = { version = "0.5.1", registry = "perish" }
keel-blob = { version = "0.5.1", registry = "perish" }
keel-relay = { version = "0.5.1", registry = "perish" }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
