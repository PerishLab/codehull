[workspace]
resolver = "3"
members = ["crates/forgejo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://git.perish.top/PerishLab/forgejo"

[workspace.dependencies]
axum = "0.8"
keel = { version = "0.1.10", registry = "perish" }
keel-gate = { version = "0.1.10", registry = "perish" }
keel-blob = { version = "0.1.10", registry = "perish" }
keel-relay = { version = "0.1.10", registry = "perish" }
postgres = "0.19"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
