[workspace]
resolver = "3"
members = ["crates/api", "crates/cli", "crates/repo", "crates/ssh"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PerishLab/codehull"

[workspace.dependencies]
radicula-process = { version = "0", registry = "perish" }
radicula-config = { version = "0", registry = "perish" }
locus = { version = "0", registry = "perish" }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
async-compression = { version = "0.4", features = ["gzip", "tokio"] }
axum = "0.8"
flate2 = "1"
futures-util = "0.3"
futures-core = "0.3"
base64 = "0.22"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
keel = { version = "0", registry = "perish", features = ["pg"] }
keel-gate = { version = "0", registry = "perish" }
keel-blob = { version = "0", registry = "perish" }
keel-relay = { version = "0", registry = "perish" }
plumb = { version = "0", registry = "perish", features = ["observation"] }
rand = "0.10"
russh = { version = "0.62", default-features = false, features = ["flate2", "ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
ureq = { version = "3", features = ["json", "rustls"] }

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
