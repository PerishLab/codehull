[workspace]
resolver = "3"
members = ["crates/forgejo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://git.perish.top/PerishLab/forgejo"

[workspace.dependencies]
axum = "0.8"
keel = { version = "0.1.0", registry = "perish" }
keel-gate = { version = "0.1.0", registry = "perish" }
keel-relay = { version = "0.1.0", registry = "perish" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
