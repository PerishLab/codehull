name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Ectropy
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: ectropy

      - name: Install stable Plumb
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: plumb

      - name: Guard
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo check --locked --workspace --all-targets --release
          if command -v helm >/dev/null 2>&1; then
            helm lint charts/codehull --quiet
          else
            echo "helm absent: chart lint stays a local gate"
          fi
          deno fmt --check crates/cli/scripts
          deno check --config crates/cli/scripts/deno.json crates/cli/scripts/act.ts
          plumb doctor .
          ectropy .
          cargo run --locked -p codehull -- act
