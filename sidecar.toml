[project]
name = "codehull"
namespace = "codehull"
root = "."

[[sidecars]]
name = "api"
command = "cargo"
args = ["run", "--locked", "-p", "api", "--", "."]
cwd = "."
mode = "dev"
port = 0
env = { API_LISTEN_PORT = "{port}" }
health_url = "http://127.0.0.1:{port}/api/health"
ready = { role = "api" }
