[project]
name = "codehull"
namespace = "codehull"
root = "."

[[sidecars]]
name = "api"
command = "cargo"
args = ["run", "--locked", "-p", "api", "--", "."]
cwd = "."
mode = "dev"
port = 0
health_url = "http://127.0.0.1:{port}/health"
ready = { role = "api" }

[app]
name = "web"
command = "pnpm"
args = ["--filter", "@codehull/web", "dev", "--"]
cwd = "."
mode = "dev"
port = 0
health_url = "http://127.0.0.1:{port}"
inherits_env = [{ name = "CODEHULL_API", from = "api.endpoint" }]
