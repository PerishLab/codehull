apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  # Fixed at 1, not a value. keel caches grant rows per engine instance, so
  # a second api pod keeps honouring a grant this one revoked until it
  # writes. Raising this needs the keel cache off first — see keel
  # docs/run/cache.md "Authority is cached too" (H-8).
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
