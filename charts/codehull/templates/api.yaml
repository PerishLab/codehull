apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  {{- if .Values.api.repo.enabled }}
  # The seat is ReadWriteOnce, so a rolling update would deadlock: the new pod
  # waits for a volume the old pod still holds.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      serviceAccountName: {{ .Release.Name }}-bootstrap
      # Bootstrap runs here rather than as a Job: a post-install hook cannot
      # reach the store before serve is ready, and a pre-install hook runs
      # before the store exists at all. The pod owns both, so the ordering is
      # structural. A replay is safe — an occupied estate re-reads its kept
      # sudo seat instead of minting a second one.
      initContainers:
        - name: bootstrap
          image: "{{ .Values.api.image }}:{{ .Values.api.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          args:
            - bootstrap
            - /codehull
            - --artifact
            - sudo=kubernetes:{{ .Release.Name }}-sudo
          env:
            {{- include "codehull.store" . | nindent 12 }}
      containers:
        - name: api
          image: "{{ .Values.api.image }}:{{ .Values.api.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          # serve takes no --artifact. The sudo seat is reachable only from
          # bootstrap, so the serving container cannot read it at all.
          args:
            - serve
            - /codehull
          env:
            {{- include "codehull.store" . | nindent 12 }}
            {{- include "codehull.seam" . | nindent 12 }}
            {{- include "codehull.seat" . | nindent 12 }}
          {{- if .Values.api.repo.enabled }}
          volumeMounts:
            - name: seat
              mountPath: {{ .Values.api.repo.mount }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
      {{- if .Values.api.repo.enabled }}
      volumes:
        - name: seat
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-seat
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
