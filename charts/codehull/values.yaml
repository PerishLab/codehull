api:
  image: git.perish.top/perishlab/codehull-api
  # tag defaults to Chart.appVersion; override only to pin a different image
  tag: ""
  # A released tag is immutable, so IfNotPresent is right for delivery. Set
  # Always while iterating on a tag whose contents move under it.
  pullPolicy: IfNotPresent
  # Keep at 1. keel caches grant rows per engine instance, so a second
  # api pod keeps honouring a grant this one revoked until it writes.
  # Raising this needs the keel cache off first — see keel docs/run/cache.md.
  replicas: 1
  port: 3400
  # The git seat. Repository objects and refs are the api's own durable truth,
  # held beside the metadata store rather than inside it, so they need a volume
  # of their own. Turn this off and the ground plane never mounts: the api
  # serves metadata and hosts no git at all.
  repo:
    enabled: true
    storage: 1Gi
    # Where the volume mounts. The store is created in a "store" directory
    # inside it, never at the mount itself — the store refuses a directory that
    # already exists without its marker, and a freshly provisioned volume is
    # exactly that. The claim outlives the release; deleting it destroys every
    # repository this deployment holds.
    mount: /codehull/ground
web:
  image: git.perish.top/perishlab/codehull-web
  tag: ""
  pullPolicy: IfNotPresent
  replicas: 1
ingress:
  enabled: true
  className: ""
  host: codehull.local
  # TLS is expressed two ways because clusters differ, and neither is baked in:
  #   - annotations: for a cluster holding a default certificate, ask for TLS
  #     without naming one (Traefik: traefik.ingress.kubernetes.io/router.tls:
  #     "true"); or point cert-manager at an issuer.
  #   - tls: the standard per-host form, e.g.
  #     [{secretName: codehull-tls, hosts: [...]}].
  annotations: {}
  tls: []
postgres:
  bundled: true
  # Point at an existing Secret instead of letting the chart hold the
  # credential. Set both fields; url and password are then ignored.
  urlSecret:
    name: ""
    key: ""
  url: ""
  image: postgres:17-alpine
  user: codehull
  db: codehull
  # Left empty on purpose. The chart generates one on first install and
  # preserves it across upgrades; a well-known default is not a credential.
  password: ""
  storage: 1Gi
oidc:
  # The issuer whose tokens admit an operator. codehull mints no identity of
  # its own, so serve refuses to start until this one answers its discovery
  # and publishes a key — an api pod will not come up before its issuer does.
  issuer: ""
  # What this deployment answers to in a token's audience. The issuer must
  # carry an App with this slug and mode "resource", or it will mint nothing
  # this deployment accepts.
  audience: codehull
blob:
  # Metadata truth is keel's and the bytes are the vault's. With no endpoint
  # the blob plane stays off rather than half-wired.
  endpoint: ""
  key: ""
  # The secret holding API_BLOB_SECRET. The chart never carries object storage
  # credentials of its own.
  secretName: ""
  secretKey: ""
